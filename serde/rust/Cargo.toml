[package]
name = "serde-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Сравнение аллокаторов: default (системный malloc macOS) vs jemalloc vs mimalloc.
# Ровно один аллокатор на бинарь: cargo run --release --features jemalloc --bin etl
default = []
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = "0.17"
prost = "0.14"
rkyv = "0.8"
zerocopy = { version = "0.8", features = ["derive"] }

# модуль serdebench (flatbuffers-кодоген) подключён через #[path] в lib.rs
flatbuffers = "25"
zstd = "0.13"

[dev-dependencies]
criterion = "0.7"

[dependencies.tikv-jemallocator]
version = "0.6"
optional = true

[dependencies.mimalloc]
version = "0.1"
optional = true

[[bin]]
name = "gen"
path = "src/bin/gen.rs"

[[bench]]
name = "json"
harness = false

[[bench]]
name = "proto"
harness = false

[[bench]]
name = "zerocopy"
harness = false

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "sizes"
harness = false

[[bench]]
name = "etl"
harness = false

[[bench]]
name = "fb"
harness = false

[profile.bench]
lto = "thin"
